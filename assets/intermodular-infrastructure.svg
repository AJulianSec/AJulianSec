    <text x="205" y="238" font-size="15">PostgreSQL</text>
    <text x="205" y="258" font-size="12">Database</text>
    <text x="450" y="238" font-size="15">Wazuh + Elastic</text>
    <text x="450" y="258" font-size="12">Monitoring</text>
    <text x="695" y="238" font-size="15">Ansible</text>
    <text x="695" y="258" font-size="12">Automation</text>
